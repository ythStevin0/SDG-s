name: CI Cross-Platform Modular Monolith

on:
  push:
    branches: [main, deployment, mobile-monolith]
  pull_request:
    branches: [main, deployment]

jobs:
  backend-go:
    name: Go Modular Monolith (Vet & Unit Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build ./cmd/api

  mobile-flutter:
    name: Flutter Mobile & Cross-Platform (Analyze, Test & APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: simpanjual-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  web-react:
    name: React.js Web Companion (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
